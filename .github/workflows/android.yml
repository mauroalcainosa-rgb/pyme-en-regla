# Compila el archivo .aab firmado para Google Play. Se ejecuta a mano desde la pestaña "Actions" de GitHub.
name: Compilar app Android (Google Play)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [www/**, package.json, capacitor.config.json, admob.json, assets/**, scripts/**, .github/workflows/**]
jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Crear y configurar proyecto Android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          node scripts/configurar-android.mjs
          npx cap sync android
      - name: Compilar .aab (firmado si existen los secretos; si no, sin firmar)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/upload.keystore
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/app/upload.keystore \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KS_PASS"
          else
            ./gradlew bundleRelease
          fi
      - name: Guardar el .aab para descargarlo
        uses: actions/upload-artifact@v4
        with:
          name: pyme-en-regla-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
