<!DOCTYPE html>

<head>

<title>Pyme en Regla</title>
<style>
/* Layout: app estilo iOS — barra de navegación con título grande, listas agrupadas, hojas (sheets) inferiores y barra de pestañas fija abajo */
:root{
  --bg:#f2f2f7; --cell:#ffffff; --ink:#000000; --muted:#6e6e73; --sep:#d1d1d6; --fill:#e9e9ee;
  --blue:#007aff; --green:#34c759; --orange:#ff9500; --red:#ff3b30; --indigo:#5856d6;
  --green-soft:#e3f6e8; --orange-soft:#fff1dc; --red-soft:#ffe5e3; --blue-soft:#e1efff;
  --bar:rgba(249,249,251,.88);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1c1c1e; --ink:#ffffff; --muted:#98989f; --sep:#38383a; --fill:#2c2c2e;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6;
  --green-soft:#12301b; --orange-soft:#3a2a0e; --red-soft:#3d1513; --blue-soft:#0f2742; --bar:rgba(22,22,24,.88); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1c1c1e; --ink:#ffffff; --muted:#98989f; --sep:#38383a; --fill:#2c2c2e;
  --blue:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --indigo:#5e5ce6;
  --green-soft:#12301b; --orange-soft:#3a2a0e; --red-soft:#3d1513; --blue-soft:#0f2742; --bar:rgba(22,22,24,.88); color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
p{margin:0}
.navbar{position:sticky;top:0;z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);padding:calc(env(safe-area-inset-top) + 8px) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));border-bottom:.5px solid var(--sep)}
.navrow{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:32px}
.navrow .store{font-size:13px;color:var(--muted)}
.navbtns{display:flex;gap:10px;align-items:center}
.iconbtn{border:0;background:none;color:var(--blue);font-size:17px;padding:4px;cursor:pointer;display:flex;align-items:center;gap:4px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600;border:0;cursor:pointer}
.largetitle{max-width:720px;margin:0 auto;padding:4px 0 0}

main{max-width:720px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:22px}
.section{display:grid;gap:6px}
.shead{font-size:13px;text-transform:uppercase;color:var(--muted);padding:0 16px;letter-spacing:.02em}
.sfoot{font-size:13px;color:var(--muted);padding:0 16px}
.group{background:var(--cell);border-radius:10px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;position:relative;width:100%;text-align:left;border:0;background:var(--cell)}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}

.cell .title{font-size:17px}

.pill.ok{background:var(--green-soft);color:var(--green)} .pill.warn{background:var(--orange-soft);color:var(--orange)} .pill.bad{background:var(--red-soft);color:var(--red)} .pill.info{background:var(--blue-soft);color:var(--blue)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.seg.wide{display:flex}.seg.wide button{flex:1}

.q{padding:12px 16px;display:grid;gap:8px;position:relative}

.q .qt p{flex:1}

.q .rec{font-size:14px;color:var(--muted)}
.btn{border:0;background:var(--blue);color:#fff;font-size:17px;font-weight:600;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%}
.btn.tinted{background:var(--blue-soft);color:var(--blue)}
.btn.plain{background:none;color:var(--blue);padding:8px}

.banner{background:var(--orange-soft);border-radius:12px;padding:12px 14px;display:grid;gap:10px;font-size:15px}
.doc{white-space:pre-wrap;font-size:14px;padding:14px 16px;max-height:420px;overflow:auto}
.empty{color:var(--muted);text-align:center;padding:22px 16px;font-size:15px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted);cursor:pointer;padding:2px 0}
.tabbar button svg{width:26px;height:26px}
.tabbar button[aria-current="page"]{color:var(--blue)}
/* hoja inferior */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:720px;max-height:92%;border-radius:14px 14px 0 0;background:var(--bg);color:var(--ink);overflow:auto}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}
@media (min-width:760px){dialog.sheet{margin:auto;border-radius:14px;max-height:86%}}
.sheethead{position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 16px 10px;display:grid;gap:6px}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:0 auto}
.sheetbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheetbar h2{font-size:17px;font-weight:600;margin:0;text-align:center;flex:1}
.sheetbar button{min-width:80px}
.sheetbar button:last-child{text-align:right;font-weight:600}
.sheetbody{padding:4px 16px calc(24px + env(safe-area-inset-bottom));display:grid;gap:22px}
.field{display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:44px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{flex:0 0 40%;font-size:16px}
.field.stack{flex-wrap:wrap}.field.stack label{flex:1 1 100%}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;text-align:right;padding:4px 0}
.field textarea{text-align:left;min-height:70px;resize:vertical;flex:1 1 100%}
.field select{appearance:none;-webkit-appearance:none;text-align:right;text-align-last:right;color:var(--muted);cursor:pointer}
.field input:focus,.field select:focus,.field textarea:focus{outline:none}
.field:focus-within{background:var(--fill)}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.refart{font-size:13px;font-weight:600;color:var(--blue)}
.reftext{font-size:16px}
.check{color:var(--blue);font-weight:600}
a{color:var(--blue)}
.small{font-size:13px;color:var(--muted)}
table.rep{width:100%;border-collapse:collapse;font-size:14px}
table.rep th,table.rep td{text-align:left;padding:8px 10px;border-bottom:.5px solid var(--sep);vertical-align:top}
table.rep th{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:600}
.scrollx{overflow-x:auto}
.toast{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:30;max-width:420px;margin:auto;background:rgba(40,40,44,.94);color:#fff;border-radius:12px;padding:12px 16px;font-size:15px;text-align:center}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* encuesta */
.progress{height:4px;background:var(--fill);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);border-radius:2px;transition:width .25s}
.qhead{display:grid;gap:8px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}
.qtitle{display:flex;gap:8px;align-items:flex-start}
.qtitle h2{flex:1;margin:0;font-size:22px;line-height:1.25;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative;width:100%;text-align:left;border:0;background:var(--cell);cursor:pointer;font-size:17px}
.opt+.opt::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.opt:active{background:var(--fill)}
.mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);flex:none;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}

.opt[aria-checked="true"] .mark{background:var(--blue);border-color:var(--blue)}
.navq{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.intro{background:var(--cell);border-radius:14px;padding:20px;display:grid;gap:12px;text-align:center;justify-items:center}
.intro .big{width:64px;height:64px;border-radius:16px;background:var(--blue);display:grid;place-items:center}
.intro .big svg{width:36px;height:36px}
.intro h2{margin:0;font-size:24px}
.measure{display:flex;gap:12px;padding:12px 16px;position:relative;align-items:flex-start}
.measure+.measure::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.measure .main{flex:1;display:grid;gap:4px}
.measure .main b{font-weight:600}
.measure.done .main b{text-decoration:line-through;color:var(--muted)}
.chk{border:0;background:none;padding:0;cursor:pointer;flex:none;margin-top:1px}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.tile .dot,.cell .dot{display:inline-block}
/* ===== Identidad Datos en Regla: azul marino institucional + verde "en regla" ===== */
:root{

  --green:#1f9d57; --orange:#d97f06; --red:#d63a2c; --indigo:#12355b;

<script>
"use strict";
// ================== Ley ==================
const VIGENCIA=new Date(2026,11,1), PLAZO=30;
const LEY="Ley 19.628, modificada por la Ley 21.719";
const LEYCHILE="https://www.bcn.cl/leychile/navegar?idNorma=141599";
const DERECHOS=["Acceso","Rectificación","Supresión","Oposición","Portabilidad","Bloqueo"];

const REF={
  gobierno:{art:"Arts. 3 y 14 (responsabilidad del responsable)",t:"El responsable debe cumplir los principios de la ley y poder demostrarlo (principio de responsabilidad). En la práctica, alguien debe estar a cargo. La ley permite además, de forma voluntaria, adoptar un modelo de prevención de infracciones con un delegado de protección de datos."},
  responsable:{art:"Art. 2 (definiciones)",t:"El responsable es la persona natural o jurídica que decide los fines y medios del tratamiento. En una pyme, normalmente es la propia empresa."},
  rol:{art:"Art. 2",t:"La ley distingue al responsable (la empresa) del encargado (quien trata datos por cuenta de ella, como un contador externo)."},
  canal:{art:"Arts. 11 y 14 ter",t:"La empresa debe informar cómo ejercer los derechos y mantener un medio accesible para recibir solicitudes, como un correo de privacidad."},
  titulares:{art:"Art. 2 (titular de datos)",t:"El titular es la persona natural a quien se refieren los datos: clientes, trabajadores, postulantes, proveedores personas naturales o visitas."},
  sensibles:{art:"Art. 2 letra g) y art. 16",t:"Son datos sensibles, entre otros, los de salud, biométricos (huella, rostro), origen étnico, afiliación política o sindical, creencias, vida sexual y orientación sexual. Solo pueden tratarse con consentimiento expreso o en los casos que la ley autoriza, y exigen más seguridad."},
  datos:{art:"Art. 3 (principio de proporcionalidad)",t:"Solo se deben recopilar los datos necesarios, adecuados y pertinentes para la finalidad."},
  finalidad:{art:"Art. 3 (principio de finalidad)",t:"Los datos deben recopilarse para fines específicos, explícitos y lícitos, y no pueden usarse después para fines incompatibles."},
  base:{art:"Arts. 12 y 13 (fuentes de licitud)",t:"Todo tratamiento necesita una base legal: consentimiento del titular (art. 12) u otra fuente que la ley reconoce, como la ejecución de un contrato, el cumplimiento de una obligación legal o el interés legítimo del responsable (art. 13). El consentimiento debe ser libre, informado, específico e inequívoco."},
  conservacion:{art:"Art. 3 (principio de proporcionalidad)",t:"Los datos solo pueden conservarse por el tiempo necesario para la finalidad. Después deben eliminarse o anonimizarse, salvo que otra ley exija guardarlos (plazos tributarios o laborales)."},
  acceso:{art:"Arts. 14 bis y 15 bis",t:"Quienes acceden a los datos deben guardar secreto (art. 14 bis). Si un tercero los trata por cuenta de la empresa, es un encargado y debe existir un contrato con sus obligaciones (art. 15 bis)."},
  extranjero:{art:"Arts. 27 y 28 (transferencia internacional)",t:"Alojar o enviar datos fuera de Chile, por ejemplo en servicios en la nube, es una transferencia internacional. Se permite hacia países con nivel adecuado de protección o con garantías apropiadas, como cláusulas contractuales, y debe informarse al titular."},
  derecho:{art:"Arts. 4 a 9",t:"Acceso: saber qué datos se tienen. Rectificación: corregirlos. Supresión: borrarlos. Oposición: oponerse a un uso. Portabilidad: recibirlos en formato electrónico. Bloqueo: suspender temporalmente su tratamiento."},
  recibida:{art:"Art. 11 (procedimiento ante el responsable)",t:"El responsable debe acusar recibo y pronunciarse a más tardar dentro de 30 días corridos desde el ingreso de la solicitud. El plazo puede prorrogarse por una sola vez, hasta por 30 días."},
  estado:{art:"Art. 11",t:"Si la solicitud se rechaza total o parcialmente, la respuesta debe ser fundada. El titular puede reclamar ante la Agencia de Protección de Datos Personales."},
  canalsol:{art:"Art. 11",t:"Registra por dónde llegó la solicitud: sirve para probar la fecha de ingreso, desde la que corre el plazo."},
  incidente:{art:"Art. 14 sexies (vulneraciones de seguridad)",t:"Ante una vulneración de seguridad que genere un riesgo razonable para los titulares, hay que informar a la Agencia por los medios más expeditos posibles y sin dilaciones indebidas. La ley no fija un número de horas."},

async function getDoc(k){
  if(MODE==="db"){const r=await DB.collection("data/users/"+UID).doc(k).get();const v=r&&typeof r.data==="function"?r.data():r;return v&&typeof v.json==="string"?JSON.parse(v.json):null}
  if(MODE==="local"){const raw=localStorage.getItem("der3:"+k);return raw?JSON.parse(raw):null}
  return null;
}
let chain=Promise.resolve();
function setDoc(k,val){
  chain=chain.then(async()=>{
    try{
      if(MODE==="db") await DB.collection("data/users/"+UID).doc(k).set({json:JSON.stringify(val),actualizado:new Date().toISOString()});
      else if(MODE==="local") localStorage.setItem("der3:"+k,JSON.stringify(val));
    }catch(e){toast("No se pudo guardar. Revisa tu conexión.")}
  });
}
function borrarDoc(k){chain=chain.then(async()=>{try{if(MODE==="db")await DB.collection("data/users/"+UID).doc(k).delete();else if(MODE==="local")localStorage.removeItem("der3:"+k)}catch(e){}})}

const IDB={_db:null,
  open(){if(this._db)return Promise.resolve(this._db);return new Promise((ok,ko)=>{const r=indexedDB.open("pyme-en-regla",1);r.onupgradeneeded=()=>r.result.createObjectStore("blobs");r.onsuccess=()=>{this._db=r.result;ok(this._db)};r.onerror=()=>ko(r.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((ok,ko)=>{const t=db.transaction("blobs",mode);const st=t.objectStore("blobs");const q=fn(st);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>ko(t.error)})},
  put(id,b){return this.tx("readwrite",s=>s.put(b,id))},get(id){return this.tx("readonly",s=>s.get(id))},del(id){return this.tx("readwrite",s=>s.delete(id))},clear(){return this.tx("readwrite",s=>s.clear())}};
function blobToB64(b){return new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=ko;r.readAsDataURL(b)})}
const LOCAL_DL={async save({filename,data}){
  const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith(".json")?"application/json":"text/plain"});
  if(NATIVE&&PL.Filesystem&&PL.Share){
    const safe=filename.replace(/[^\w.\- áéíóúñÁÉÍÓÚÑ]/g,"");
    const w=await PL.Filesystem.writeFile({path:safe,data:await blobToB64(blob),directory:"CACHE"});
    try{await PL.Share.share({title:safe,files:[w.uri]})}catch(e){throw {code:"declined"}}
    return {status:"saved"};
  }
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:"saved"};
}};
const LOCAL_ASSETS={async upload(f){if(f.size>20*1024*1024)throw {code:"too_large"};const id=uid()+uid();await IDB.put(id,f);return {id,contentType:f.type||"application/octet-stream"}},async delete(id){await IDB.del(id)}};
async function hidratar(root){for(const el of root.querySelectorAll("[data-blob]")){try{const b=await IDB.get(el.dataset.blob);if(b)el.src=URL.createObjectURL(b)}catch(e){}}}

// ================== Utilidades ==================
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pISO(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function hoy(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dias(a,b){return Math.round((b-a)/86400000)}
function fmt(d){return d?d.toLocaleDateString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric"}):"—"}
function initials(s){return (s||"+").replace(/\b(SpA|S\.A\.|Ltda\.?|EIRL)\b/gi,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"+"}
let tt;function toast(m){document.querySelectorAll(".toast").forEach(x=>x.remove());const b=document.createElement("div");b.className="toast";b.setAttribute("role","status");b.textContent=m;document.body.appendChild(b);clearTimeout(tt);tt=setTimeout(()=>b.remove(),3200)}
function infoBtn(r){return r?`<button type="button" class="info" data-ref="${r}" aria-label="Ver referencia legal">${I.info}</button>`:""}
function pill(c,t){return `<span class="pill ${c}">${esc(t)}</span>`}

// ================== Puntaje y medidas ==================
function evalQ(q,ans){
  if(ans===undefined||ans===null||(Array.isArray(ans)&&!ans.length)) return null;
  if(q.multi){
    const sel=ans.filter(i=>i>0).map(i=>q.o[i][0]);
    if(!sel.length) return {pts:3};
    return {pts:sel.length>=2?0:1,h:q.hall(sel),m:q.med};
  }
  const o=q.o[ans]; return {pts:o[1],h:o[2],m:o[3]};
}
function score(d=D()){
  let pts=0,resp=0,act=0;const med=[],ok=[];
  const areas=AREAS.map(a=>({...a,p:0,max:0,resp:0}));
  for(const q of Q){
    const r=evalQ(q,d.enc[q.id]); const ar=areas.find(x=>x.id===q.a); ar.max+=3;
    if(!r) continue; resp++; pts+=r.pts; ar.p+=r.pts; ar.resp++;
    if(r.pts<3){const m={id:q.id,c:q.c,area:ar.name,h:r.h,m:r.m,ref:q.ref,prio:r.pts===0?"alta":"media",plazo:r.pts===0?"30 días":"90 días",pts:r.pts};
      Object.assign(m,brecha(d,m));m.hecha=m.estado==="Corregida";med.push(m);act+=m.hecha?3:r.pts;}
    else {ok.push(q);act+=3}
  }
  med.sort((a,b)=>(a.prio==="alta"?0:1)-(b.prio==="alta"?0:1));
  const pct=Math.round(pts*100/MAXP), falt=Q.length-resp;
  const nivel=falt?"info":pct>=80?"ok":pct>=50?"warn":"bad";
  const nivelTxt=falt?`Encuesta ${resp}/${Q.length}`:pct>=80?"Bien encaminada":pct>=50?"Cumplimiento parcial":"Riesgo alto";
  areas.forEach(a=>a.pct=Math.round(a.p*100/a.max));
  const pctAct=Math.round(act*100/MAXP);
  return {pct,pctAct,resp,falt,nivel,nivelTxt,areas,med,ok,hechas:med.filter(m=>m.hecha).length};
}

// ================== Brechas y alertas ==================
function baseDate(d){return pISO(d.fechaDiag)||hoy()}
function brecha(d,m){
  const b=d.brechas[m.id]||{};
  let vence=b.vence;if(!vence){const v=new Date(baseDate(d));v.setDate(v.getDate()+(m.prio==="alta"?30:90));vence=v.getFullYear()+"-"+String(v.getMonth()+1).padStart(2,"0")+"-"+String(v.getDate()).padStart(2,"0")}
  const estado=b.estado||(d.hechas&&d.hechas[m.id]?"En curso":"Pendiente");
  const resp=b.respaldos||[];const dl=dias(hoy(),pISO(vence));
  const alerta=estado==="Corregida"?"ok":dl<0?"bad":dl<=7?"warn":"none";
  return {estado,responsable:b.responsable||"",vence,dl,respaldos:resp,historial:b.historial||[],alerta};
}
function plazoPill(m){if(m.estado==="Corregida")return pill("ok","Corregida");return m.dl<0?pill("bad",`Vencida hace ${-m.dl} d`):m.dl===0?pill("bad","Vence hoy"):m.dl<=7?pill("warn",`Vence en ${m.dl} d`):pill("info",`Vence ${fmt(pISO(m.vence))}`)}
function estadoPill(e){return pill(e==="Corregida"?"ok":e==="En curso"?"info":"warn",e)}
function alertas(d=D()){
  const s=score(d),a=[];
  for(const m of s.med){if(m.estado==="Corregida")continue;
    if(m.dl<0)a.push({n:"bad",t:`Brecha vencida hace ${-m.dl} días: ${m.c}`,b:m.id});
    else if(m.dl<=7)a.push({n:"warn",t:`Vence en ${m.dl} días: ${m.c}`,b:m.id});
    if(m.estado==="En curso"&&!m.respaldos.length&&m.dl<=14)a.push({n:"warn",t:`Sin respaldos y por vencer: ${m.c}`,b:m.id});
    if(!m.responsable&&m.prio==="alta")a.push({n:"info",t:`Sin responsable asignado: ${m.c}`,b:m.id});}
  for(const x of d.solicitudes){if(cerrada(x))continue;const v=venc(x);if(!v)continue;const dl=dias(hoy(),v);
    if(dl<0)a.push({n:"bad",t:`Solicitud de ${x.derecho.toLowerCase()} de ${x.titular} vencida`,go:"solicitudes"});else if(dl<=7)a.push({n:"warn",t:`Solicitud de ${x.titular} vence en ${dl} días`,go:"solicitudes"})}
  for(const x of d.incidentes){if(x.estado==="Cerrado")continue;
    if(x.sensibles==="Sí"&&x.titulares!=="Sí")a.push({n:"bad",t:`Incidente sin aviso a afectados: ${x.descripcion}`,go:"incidentes"});
    else if(x.agencia==="No")a.push({n:"warn",t:`Incidente abierto sin evaluar aviso a la Agencia: ${x.descripcion}`,go:"incidentes"})}
  if(s.falt&&s.resp)a.push({n:"info",t:`Encuesta incompleta: faltan ${s.falt} preguntas`,tab:"encuesta"});
  const ord={bad:0,warn:1,info:2};return a.sort((x,y)=>ord[x.n]-ord[y.n]);
}

function ring(pct,nivel,size=76){const c={ok:"var(--green)",warn:"var(--orange)",bad:"var(--red)",info:"var(--blue)"}[nivel];const r=size*.39,L=2*Math.PI*r,cx=size/2;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Cumplimiento ${pct}%"><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${size*.12}"/><circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${c}" stroke-width="${size*.12}" stroke-linecap="round" stroke-dasharray="${L*pct/100} ${L}" transform="rotate(-90 ${cx} ${cx})"/><text x="${cx}" y="${cx+size*.075}" text-anchor="middle" font-size="${size*.23}" font-weight="700" fill="currentColor">${pct}%</text></svg>`}

function elegir(qid,i){
  const q=Q.find(x=>x.id===qid), d=D();
  if(q.multi){let a=Array.isArray(d.enc[qid])?[...d.enc[qid]]:[];
    if(i===0)a=a.includes(0)?[]:[0];else{a=a.filter(x=>x!==0);a=a.includes(i)?a.filter(x=>x!==i):[...a,i]}
    d.enc[qid]=a;if(P.activo)saveD();render();}
  else{d.enc[qid]=i;delete d.hechas[qid];if(P.activo)saveD();render();setTimeout(()=>{if(tab==="encuesta"&&D().paso===Q.findIndex(x=>x.id===qid)+1)setPaso(D().paso+1)},280)}
}

// ---------- Marca en PDF ----------
const NAVY=[18,53,91],TEAL=[18,163,122];
let LOGO_PNG=null;
async function logoPNG(){
  if(LOGO_PNG)return LOGO_PNG;
  try{const svg=LOGO("pdf");const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" '));
    await img.decode();const c=document.createElement("canvas");c.width=c.height=256;c.getContext("2d").drawImage(img,0,0,256,256);LOGO_PNG=c.toDataURL("image/png");}catch(e){LOGO_PNG="none"}
  return LOGO_PNG;
}
async function pdfHeader(doc,titulo,sub){
  const W=210;doc.setFillColor(...NAVY);doc.rect(0,0,W,30,"F");doc.setFillColor(...TEAL);doc.rect(0,30,W,1.2,"F");
  const png=await logoPNG();
  if(png&&png!=="none")doc.addImage(png,"PNG",14,6,18,18);
  else{doc.setFillColor(255,255,255);doc.roundedRect(14,6,18,18,4,4,"F");doc.setDrawColor(...TEAL);doc.setLineWidth(1.6);doc.lines([[3.2,3.2],[6.5,-7]],18.5,15.5)}
  doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(15);doc.text("Pyme",36,14);
  const wd=doc.getTextWidth("Pyme ");doc.setTextColor(63,209,162);doc.text("en Regla",36+wd,14);
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(185,203,224);doc.text(LEYENDA,36,20);
  doc.setTextColor(255);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(titulo,196,14,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(8.5);doc.setTextColor(185,203,224);doc.text(sub,196,20,{align:"right"});
  doc.setTextColor(0);return 42;
}
function pdfFooter(doc,e,label){
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(220,226,234);doc.setLineWidth(.3);doc.line(16,285,194,285);
    doc.setFontSize(8);doc.setTextColor(110,110,115);doc.text(`Pyme en Regla · ${label} · ${e.razon||""}`,16,290);doc.text(`Página ${i} de ${n}`,194,290,{align:"right"})}
}

  h2("Resultado por área");

  y=doc.lastAutoTable.finalY+9;
  h2("Medidas que debe tomar la empresa");

    columnStyles:{0:{cellWidth:7},1:{cellWidth:36},2:{cellWidth:"auto"},3:{cellWidth:28},4:{cellWidth:20},5:{cellWidth:19}},
    head:[["#","Hallazgo","Medida correctiva","Referencia legal","Plazo","Estado"]],

    didParseCell:c=>{if(c.section!=="body")return;const m=s.med[c.row.index];if(!m)return;

function vSeg(){
  const d=D(),s=score(),al=alertas();

function fieldHTML(f,v){
  const ctl=f.type==="select"?`<select id="f_${f.id}" name="${f.id}">${f.options.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")}</select>`
    :f.type==="textarea"?`<textarea id="f_${f.id}" name="${f.id}" placeholder="Opcional">${esc(v)}</textarea>`
    :`<input id="f_${f.id}" name="${f.id}" type="${f.type}" value="${esc(v)}" placeholder="${esc(f.ph||"")}" ${f.req?"required":""}>`;
  return `<div class="field ${f.type==="textarea"?"stack":""}"><label for="f_${f.id}">${f.label}</label>${ctl}${infoBtn(f.ref)}</div>`;
}
function abrirRegistro(k,id){
  const sp=SPECS[k],it=id?D()[k].find(x=>x.id===id):{};const v=Object.assign({},it);
  if(!id&&k==="solicitudes")v.recibida=iso();if(!id&&k==="incidentes")v.fecha=iso();
  ctx={type:"reg",k,id};
  openSheet(id?sp.title:"Nuevo: "+sp.title.toLowerCase(),`<div class="group">${sp.fields.map(f=>fieldHTML(f,v[f.id]??"")).join("")}</div><div class="sfoot">Toca ⓘ para ver la referencia legal de cada dato.</div>${id?`<div class="group"><button type="button" class="cell" data-act="del" style="color:var(--red);justify-content:center">Eliminar</button></div>`:""}`,{right:"Guardar"});
}
function abrirPerfil(id){
  const p=P.perfiles.find(x=>x.id===id);ctx={type:"perfil",id};
  openSheet("Editar empresa",`<div class="group">${EMPRESA_FIELDS.map(f=>fieldHTML(f,p[f.id]??"")).join("")}</div>${P.perfiles.length>1?`<div class="group"><button type="button" class="cell" data-act="delperfil" style="color:var(--red);justify-content:center">Eliminar empresa</button></div>`:""}`,{right:"Guardar"});
}
function abrirPerfiles(){
  ctx={type:"perfiles"};
  openSheet("Empresas",`<div class="section"><div class="group">
    ${P.perfiles.map(p=>{const s=DATA[p.id]?score(DATA[p.id]):null;return `<div class="cell icon"><span class="ico" style="background:var(--blue);font-size:12px;font-weight:700">${esc(initials(p.razon))}</span>
      <button type="button" class="main" data-switch="${p.id}" style="border:0;background:none;text-align:left;cursor:pointer;padding:0"><span class="title">${esc(p.razon)}</span><span class="subtitle">${esc(p.rol||"")}${s&&s.resp?` · ${s.pct}%`:" · encuesta pendiente"}</span></button>
      ${p.id===P.activo?`<span class="check">✓</span>`:""}<button type="button" class="iconbtn" data-editperfil="${p.id}">Editar</button></div>`}).join("")}
    <button type="button" class="cell" data-act="nuevaempresa" style="color:var(--blue)">Agregar empresa y responder su encuesta</button>
  </div><div class="sfoot">Cada empresa tiene su propia encuesta, informe, registros y documentos. Útil si asesoras a varias.</div></div>
  <div class="section"><div class="shead">Acerca de</div><div class="group">
    <div class="cell icon">${LOGO("about")}<div class="main"><span class="title">Pyme en Regla</span><span class="subtitle">Versión ${APP.version} · Creada por ${APP.creador}</span></div></div>
    <div class="cell"><div class="main"><span class="title">Contacto</span><span class="subtitle" style="-webkit-user-select:text;user-select:text">${APP.correo}</span></div></div>
    <a class="cell" href="${APP.privacidad}" data-ext="1" style="color:var(--blue);text-decoration:none">Política de privacidad</a>
  </div><div class="sfoot">Herramienta de orientación sobre la ${LEY}. No reemplaza la asesoría de un abogado ni es un servicio oficial del Estado.</div></div>
  <div class="section"><div class="shead">Copia de seguridad</div><div class="group"><button type="button" class="cell" data-act="exportar" style="color:var(--blue)">Exportar copia de seguridad</button><button type="button" class="cell" data-act="importar" style="color:var(--blue)">Restaurar desde una copia</button></div><div class="sfoot">Como los datos viven solo en este teléfono, guarda una copia antes de cambiar de equipo o desinstalar la app. Las fotos y PDF adjuntos no se incluyen en la copia.</div></div>
  <div class="section"><div class="group"><button type="button" class="cell" data-act="borrartodo" style="color:var(--red);justify-content:center">Eliminar todos mis datos</button></div><div class="sfoot">${storeTxt()}. Esta acción borra todas las empresas, respuestas, registros, documentos y respaldos, y no se puede deshacer.</div></div>`,{left:"Cerrar"});
}
function abrirRef(r){
  const x=REF[r];
  openSheet("Qué dice la ley",`<div class="group"><div class="cell"><div class="main"><span class="refart">${esc(x.art)}</span><span class="reftext">${esc(x.t)}</span></div></div></div><div class="sfoot">${LEY}. Verifica el texto vigente en <a href="${LEYCHILE}" data-ext="1">LeyChile</a>.</div>`,{left:"Cerrar"});
}
function verDoc(id){const x=D().documentos.find(d=>d.id===id);ctx={type:"doc",id};openSheet(esc(x.nombre),`<div class="group"><div class="doc">${esc(x.texto)}</div></div>${docActions(id)}`,{left:"Cerrar"})}

sf.addEventListener("submit",ev=>{
  ev.preventDefault();if(!ctx)return;const data=Object.fromEntries(new FormData(sf).entries());
  if(ctx.type==="reg"){const arr=D()[ctx.k];if(ctx.id)Object.assign(arr.find(x=>x.id===ctx.id),data);else arr.unshift({id:uid(),...data});saveD();closeSheet();render();return}
  if(ctx.type==="perfil"){Object.assign(P.perfiles.find(x=>x.id===ctx.id),data);saveP();closeSheet();render();toast("Empresa actualizada.")}
  if(ctx.type==="brecha"){
    const id=ctx.id,b=bstore(id),prev=b.estado||"Pendiente",nres=(b.respaldos||[]).length;
    if(data.estado==="Corregida"&&!nres){toast("Adjunta al menos un respaldo antes de marcarla como corregida.");return}
    if(data.estado!==prev)hist(b,`Estado: ${prev} → ${data.estado}`);
    if((b.responsable||"")!==data.responsable)hist(b,`Responsable: ${data.responsable||"sin asignar"}`);
    if(b.vence&&b.vence!==data.vence)hist(b,`Plazo modificado al ${fmt(pISO(data.vence))}`);
    if(data.nota&&data.nota.trim())hist(b,`Nota: ${data.nota.trim()}`);
    b.estado=data.estado;b.responsable=data.responsable;b.vence=data.vence;saveD();closeSheet();render();toast(data.estado==="Corregida"?"Brecha corregida.":"Seguimiento guardado.");return}
  if(ctx.type==="notaresp"){const id=ctx.id,b=bstore(id);(b.respaldos=b.respaldos||[]).push({id:uid(),tipo:"nota",nombre:data.nombre,texto:data.texto||"",fecha:new Date().toISOString()});
    if(!b.estado||b.estado==="Pendiente")b.estado="En curso";hist(b,`Respaldo escrito: ${data.nombre}`);saveD();render();abrirBrecha(id);return}
});
// formulario de empresa dentro de la encuesta
document.addEventListener("submit",ev=>{
  if(ev.target.id!=="fEmp")return;ev.preventDefault();
  const data=Object.fromEntries(new FormData(ev.target).entries());
  if(P.activo){Object.assign(E(),data);saveP();D().paso=1;saveD()}
  else{const id=uid();const nd=NEW?NEW.data:blankData();nd.paso=1;P.perfiles.push({id,...data});P.activo=id;DATA[id]=nd;NEW=null;saveP();saveD()}
  render();window.scrollTo(0,0);
});

// ================== Eventos ==================
document.addEventListener("click",async ev=>{
  const a=ev.target.closest("a[data-ext]");if(a){ev.preventDefault();return abrirEnlace(a.href)}
  const b=ev.target.closest("button");if(!b)return;const ds=b.dataset;
  if(ds.openblob)return abrirArchivo(ds.openblob,ds.nombre);
  if(ds.go==="informe"&&tab==="encuesta"&&D().paso>Q.length){await Ads.inter();return go("informe")}
  if(ds.ref){ev.preventDefault();return abrirRef(ds.ref)}
  if(ds.tab)return go(ds.tab);
  if(ds.paso!==undefined){const n=+ds.paso;if(!P.activo&&n===0&&!NEW)NEW={emp:{},data:blankData()};if(!P.activo&&NEW)NEW.data.paso=n;return setPaso(n)}
  if(ds.opt!==undefined)return elegir(ds.qid,+ds.opt);
  if(ds.brecha){if(tab==="encuesta")go("seguimiento");return abrirBrecha(ds.brecha)}
  if(ds.filtro){segFiltro=ds.filtro;return render()}
  if(ds.delresp){if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Confirmar";return}const id=ctx.id,bb=bstore(id),r=(bb.respaldos||[]).find(x=>x.id===ds.delresp);
    bb.respaldos=bb.respaldos.filter(x=>x.id!==ds.delresp);hist(bb,`Respaldo quitado: ${r?r.nombre:""}`);if(bb.estado==="Corregida"&&!bb.respaldos.length){bb.estado="En curso";hist(bb,"Estado: Corregida → En curso (sin respaldos)")}
    if(r&&r.assetId&&ASSETS){try{await ASSETS.delete(r.assetId)}catch(e){}}saveD();render();return abrirBrecha(id)}
  if(ds.seg&&!ds.go){regSeg=ds.seg;return render()}
  if(ds.go){if(ds.seg)regSeg=ds.seg;return go(ds.go)}
  if(ds.add)return abrirRegistro(ds.add);
  if(ds.edit)return abrirRegistro(ds.edit,ds.id);
  if(ds.gen)return generar(ds.gen);
  if(ds.ver)return verDoc(ds.ver);
  if(ds.switch)return cambiarPerfil(ds.switch);
  if(ds.editperfil)return abrirPerfil(ds.editperfil);
  if(ds.copy){const x=D().documentos.find(d=>d.id===ds.copy);try{await navigator.clipboard.writeText(x.texto);toast("Texto copiado.")}catch(e){toast("No se pudo copiar. Selecciona el texto manualmente.")}return}
  if(ds.dldoc){const x=D().documentos.find(d=>d.id===ds.dldoc);try{await DL.save({filename:`${x.nombre} - ${E().razon||""}.txt`,data:x.texto})}catch(e){if(!e||e.code!=="declined")toast("No se pudo descargar.")}return}
  if(ds.deldoc){D().documentos=D().documentos.filter(x=>x.id!==ds.deldoc);saveD();closeSheet();return render()}
  switch(ds.act){
    case "close":return closeSheet();
    case "perfiles":return abrirPerfiles();
    case "nuevaempresa":closeSheet();P.activo=null;NEW={emp:{},data:blankData()};NEW.data.paso=0;tab="encuesta";return render();
    case "reiniciar":{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Toca de nuevo para borrar las respuestas";return}const d=D();d.enc={};d.hechas={};d.resumen="";d.paso=0;saveD();return render()}
    case "exportar":{const data=JSON.stringify({app:"pyme-en-regla",version:1,fecha:new Date().toISOString(),perfiles:P,datos:DATA});
      try{await DL.save({filename:`Respaldo Pyme en Regla ${iso()}.json`,data});toast("Copia de seguridad lista.")}catch(e){if(!e||e.code!=="declined")toast("No se pudo crear la copia.")}return}
    case "importar":{document.getElementById("impfile").click();return}
    case "borrartodo":{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Toca de nuevo para borrar todo definitivamente";return}
      for(const pf of P.perfiles){const d=DATA[pf.id];if(d&&ASSETS)for(const k in d.brechas){for(const r of (d.brechas[k].respaldos||[]))if(r.assetId){try{await ASSETS.delete(r.assetId)}catch(e){}}}borrarDoc("enc_"+pf.id)}
      borrarDoc("perfiles");try{await IDB.clear()}catch(e){}P={perfiles:[],activo:null};DATA={};NEW=null;closeSheet();go("encuesta");toast("Se eliminaron todos tus datos.");return}
    case "pdf":return pdf();
    case "pdfestado":return pdfEstado();
    case "notaresp":return notaRespaldo(ctx.id);
    case "resumen":return resumenIA();
    case "preguntar":return preguntar();
    case "del":{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Toca de nuevo para confirmar";return}D()[ctx.k]=D()[ctx.k].filter(x=>x.id!==ctx.id);saveD();closeSheet();return render()}
    case "delperfil":{if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Toca de nuevo para eliminar la empresa";return}const id=ctx.id;P.perfiles=P.perfiles.filter(x=>x.id!==id);delete DATA[id];borrarDoc("enc_"+id);return cambiarPerfil(P.perfiles[0].id)}
  }
});

document.getElementById("impfile").addEventListener("change",async ev=>{
  const f=ev.target.files&&ev.target.files[0];ev.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=="pyme-en-regla"||!j.perfiles||!j.datos)throw 0;
    P=j.perfiles;DATA={};for(const k in j.datos)DATA[k]=Object.assign(blankData(),j.datos[k]);saveP();for(const pf of P.perfiles){if(DATA[pf.id])setDoc("enc_"+pf.id,DATA[pf.id])}
    closeSheet();tab=D().paso>Q.length?"informe":"encuesta";render();toast("Copia restaurada.")}
  catch(e){toast("El archivo no es una copia válida de Pyme en Regla.")}
});
if(NATIVE&&PL.App)PL.App.addListener("backButton",()=>{if(sheet.open)closeSheet();else if(tab!=="encuesta")go("encuesta");else PL.App.exitApp()});
render();
cargar();
</script>
